<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Runtime Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; background:#0b1020; color:#e8ecf5; }
    main { max-width:1100px; margin:40px auto; padding:0 20px; }
    h1 { margin-bottom:6px; } .sub { color:#8e9ab3; margin-bottom:28px; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; }
    .card { background:#121a2d; border:1px solid #24304a; border-radius:14px; padding:18px; }
    label { display:block; margin:12px 0 7px; color:#9eabc5; font-size:13px; }
    select,input,button { width:100%; box-sizing:border-box; padding:11px; border-radius:9px; border:1px solid #34415e; background:#0d1425; color:#fff; }
    button { margin-top:16px; background:#315efb; border:0; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:wait; }
    .status { display:inline-block; padding:5px 9px; border-radius:999px; background:#173b2c; color:#72e0a7; }
    pre { white-space:pre-wrap; overflow:auto; background:#0a0f1c; padding:14px; border-radius:10px; max-height:500px; }
    .flow { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
    .node { padding:7px 10px; background:#1b2740; border-radius:8px; font-size:13px; }
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Agent Runtime Console</h1>
  <div class="sub">M1 Runtime · M2 State Machine / Checkpoint · M3 Tool / Rule Planner</div>
  <div class="grid">
    <section class="card">
      <strong>Run Agent</strong>
      <label for="tool">Tool</label>
      <select id="tool">
        <option value="uppercase">uppercase</option>
        <option value="word_count">word_count</option>
      </select>
      <label for="text">Task / Input</label>
      <input id="text" value="agent runtime is ready">
      <button id="run">Execute</button>
    </section>
    <section class="card">
      <div id="status">Ready</div>
      <div class="flow">
        <span class="node">Task</span><span>→</span><span class="node">RulePlanner</span>
        <span>→</span><span class="node">Action</span><span>→</span>
        <span class="node">ToolRegistry</span><span>→</span><span class="node">Tool</span>
        <span>→</span><span class="node">State</span><span>→</span><span class="node">Checkpoint</span>
      </div>
      <pre id="output">点击 Execute 开始验证。</pre>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
